[package]
name = "token-counter"
version = "0.1.0"
edition = "2021"
description = "Token usage, cost, and speed analytics for AI coding agents"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
jiff = "1.0"
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
zstd = "0.14"
